<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI深偽與社群詐騙 LLM Wiki</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#1b2332;font:17px/1.75 "Microsoft JhengHei",sans-serif}a{color:#4e3bc6;text-underline-offset:4px}button,input{font:inherit}button,a,input{outline-offset:4px}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #9765eb}header{padding:20px max(24px,calc((100vw - 1160px)/2));border-bottom:1px solid #d5d5d0;display:flex;gap:24px;flex-wrap:wrap}header a{font-size:15px}main{max-width:1160px;margin:auto;padding:48px 24px}h1{font-size:clamp(32px,5vw,58px);line-height:1.25;letter-spacing:-.04em;margin:12px 0 24px}h2{font-size:27px;margin-top:32px}h3{font-size:21px;margin-bottom:8px}p{max-width:86ch}.eyebrow{font-size:13px;letter-spacing:.15em;color:#625880}.lead{font-size:22px;color:#444c5b}.actions{display:flex;flex-wrap:wrap;gap:16px;margin:30px 0}.actions a{padding:12px 22px;border:1px solid #4e3bc6;border-radius:8px;text-decoration:none}.actions a:first-child{background:#4e3bc6;color:white}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;border-block:1px solid #ccc;padding:28px 0;margin:36px 0}.facts strong{font-size:42px;color:#4e3bc6;display:block}.notice{padding:16px 20px;border-left:4px solid #d5ac24;background:#fff8dd}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:40px}.side input{width:100%;padding:10px;border:1px solid #c9c9d2;border-radius:6px}.side nav a{display:block;margin:10px 0;font-size:14px}.side{min-width:0}.article{background:#fff;border:1px solid #ddd;padding:28px;min-width:0;overflow-wrap:anywhere}.article h1{font-size:30px}.article h2{font-size:22px}.article h3{font-size:18px}.article ul{padding-left:24px}.meta{font-size:14px;color:#5d6371}.graph{display:grid;gap:12px;margin:28px 0}.node{display:grid;grid-template-columns:60px 1fr 1fr;gap:18px;border-bottom:1px solid #ccc;padding:16px 12px}.node .number{color:#5d3cce;font-size:22px}.return{color:#a3481e;font-size:14px}.arrow{text-align:center;color:#7863b7;font-size:22px;line-height:1}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:10px;border:1px solid #ccc;vertical-align:top}th{background:#eeecf4}.scroll{overflow:auto}code{font-family:Consolas,monospace;font-size:.9em;background:#eeeaf6;padding:2px 4px}footer{font-size:14px;color:#616673;margin-top:40px;border-top:1px solid #ccc;padding-top:20px}@media(max-width:750px){.layout,.facts{grid-template-columns:1fr}.node{grid-template-columns:40px 1fr}.node>div:last-child{grid-column:2}main{padding:30px 20px}.article{padding:20px}.side nav{max-height:230px;overflow:auto}h1{font-size:34px}}@media print{header,.side,.actions{display:none}.layout{display:block}.article{border:0}main{padding:0}}</style></head><body><header><a href="index.html">作業入口</a><a href="deck.html">開始上課</a><a href="wiki.html">閱讀 Wiki</a><a href="workflow.html">流程與證據</a></header><main><p class="eyebrow">LLM WIKI · INGEST → QUERY → LINT</p><h1>先累積知識，再產生教材</h1><p class="lead">8份官方資料，6頁跨來源知識，保留主張與限制。</p><p class="meta">Wiki由Codex編寫維護；下方搜尋是本機關鍵字篩選，不是即時AI聊天。</p><div class="layout"><aside class="side"><label for="wiki-search">搜尋頁面</label><input id="wiki-search" type="search" placeholder="例如：LINE、聲音、預錄"><nav id="wiki-list" aria-label="知識頁面"></nav><p><a href="wiki/index.md">Markdown索引</a> · <a href="wiki/log.md">處理日誌</a></p></aside><article id="wiki-article" class="article" aria-live="polite"></article></div></main><script id="wiki-data" type="application/json">[{"id": "S01", "path": "sources/S01.md", "title": "慎防AI深偽詐騙", "kind": "source", "sources": ["S01"], "summary": "在臺灣情境中介紹165、先停下匯款與個資交付；以S03、S04補足已知聯絡方式回撥。", "claims": [{"id": "S01-C1", "text": "警方宣導指出，換臉與仿聲可被用來冒充親友。", "location": "正文：AI變臉／AI變聲假親友", "sources": ["S01"], "locator": "正文：AI變臉／AI變聲假親友"}, {"id": "S01-C2", "text": "可事先與親友約定通關密語，遇到疑似假親友時查核身分。", "location": "正文：通關密語", "sources": ["S01"], "locator": "正文：通關密語"}, {"id": "S01-C3", "text": "遇可疑要求先不匯款、不提供個資，有疑慮可撥165反詐騙專線。", "location": "正文：2不3要", "sources": ["S01"], "locator": "正文：2不3要"}], "updated": "2026-11-15", "html": "\u003ch1>S01 慎防AI深偽詐騙\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>原文：\u003ca href=\"https://md-fraud.police.gov.taipei/News_Content.aspx?n=BD99F0864A7983ED&amp;s=1A33FBCA5115E6C9\">臺北市政府警察局刑事警察大隊／臺北市政府警察局防制詐騙專區\u003c/a>\u003c/p>\u003cp>原文日期：2024-04-08；查閱：2026-11-15\u003c/p>\u003cp>封存節錄：\u003ca href=\"raw/S01.md\">raw/S01.md\u003c/a>\u003c/p>\u003ch2>LLM 整理的可支持主張\u003c/h2>\u003ch3>S01-C1\u003c/h3>\u003cp>警方宣導指出，換臉與仿聲可被用來冒充親友。\u003c/p>\u003cp>依據位置：正文：AI變臉／AI變聲假親友。\u003c/p>\u003ch3>S01-C2\u003c/h3>\u003cp>可事先與親友約定通關密語，遇到疑似假親友時查核身分。\u003c/p>\u003cp>依據位置：正文：通關密語。\u003c/p>\u003ch3>S01-C3\u003c/h3>\u003cp>遇可疑要求先不匯款、不提供個資，有疑慮可撥165反詐騙專線。\u003c/p>\u003cp>依據位置：正文：2不3要。\u003c/p>\u003ch2>範圍與不能推論的內容\u003c/h2>\u003cul>\u003cli>沒有具體受害者、日期或損失資料，不能包裝成一則已證實的臺灣深偽案件。\u003c/li>\u003cli>頁面提到左右擺頭／臉前揮手，但沒有檢測準確率；不能宣稱某個動作能保證辨真偽。\u003c/li>\u003cli>沒有臺灣Gen Z的受害率或平台差異數據。\u003c/li>\u003c/ul>\u003ch2>知識連結\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "S02", "path": "sources/S02.md", "title": "LCQ9: Combating frauds involving deepfake", "kind": "source", "sources": ["S02"], "summary": "用於具體案例：熟悉的臉與主管權威，不能替代組織核准流程和另外查證。", "claims": [{"id": "S02-C1", "text": "警方於2024年1月底接獲一宗案件：騙徒冒充英國總部財務總監，先用釣魚電郵邀請員工參與所謂機密交易的視訊會議。", "location": "答覆(1)：end-January 2024", "sources": ["S02"], "locator": "答覆(1)：end-January 2024"}, {"id": "S02-C2", "text": "報案者依指示授權款項轉往五個香港銀行帳戶，損失約港幣兩億元。", "location": "答覆(1)：HK$200 million", "sources": ["S02"], "locator": "答覆(1)：HK$200 million"}, {"id": "S02-C3", "text": "警方當時相信會議是由公開影片與聲音製作的預錄內容，報案者與騙徒實際沒有互動，後續匯款指示透過即時通訊傳送。", "location": "答覆(1)：pre-recorded；no interaction", "sources": ["S02"], "locator": "答覆(1)：pre-recorded；no interaction"}], "updated": "2026-11-15", "html": "\u003ch1>S02 LCQ9: Combating frauds involving deepfake\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>原文：\u003ca href=\"https://www.info.gov.hk/gia/general/202406/26/P2024062600192p.htm\">香港特別行政區政府新聞公報／保安局局長鄧炳強於立法會的書面答覆，引用警方調查\u003c/a>\u003c/p>\u003cp>原文日期：2024-06-26；查閱：2026-11-15\u003c/p>\u003cp>封存節錄：\u003ca href=\"raw/S02.md\">raw/S02.md\u003c/a>\u003c/p>\u003ch2>LLM 整理的可支持主張\u003c/h2>\u003ch3>S02-C1\u003c/h3>\u003cp>警方於2024年1月底接獲一宗案件：騙徒冒充英國總部財務總監，先用釣魚電郵邀請員工參與所謂機密交易的視訊會議。\u003c/p>\u003cp>依據位置：答覆(1)：end-January 2024。\u003c/p>\u003ch3>S02-C2\u003c/h3>\u003cp>報案者依指示授權款項轉往五個香港銀行帳戶，損失約港幣兩億元。\u003c/p>\u003cp>依據位置：答覆(1)：HK$200 million。\u003c/p>\u003ch3>S02-C3\u003c/h3>\u003cp>警方當時相信會議是由公開影片與聲音製作的預錄內容，報案者與騙徒實際沒有互動，後續匯款指示透過即時通訊傳送。\u003c/p>\u003cp>依據位置：答覆(1)：pre-recorded；no interaction。\u003c/p>\u003ch2>範圍與不能推論的內容\u003c/h2>\u003cul>\u003cli>不能寫成即時、可自由對話的多人AI換臉會議；本頁明言預錄且無互動。\u003c/li>\u003cli>公報未在這段案件中指名受害公司；不自行加入Arup等公司名稱。\u003c/li>\u003cli>這是香港企業員工案件；不能稱臺灣學生案件或推算臺灣損失。\u003c/li>\u003cli>『仍在調查』是2024-06-26當時狀態，未查證2026年的最終案情。\u003c/li>\u003c/ul>\u003ch2>知識連結\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "S03", "path": "sources/S03.md", "title": "Scammers use AI to enhance their family emergency schemes", "kind": "source", "sources": ["S03"], "summary": "將『熟悉聲音＋急迫匯款』拆成警訊，建立已知電話回撥的練習。", "claims": [{"id": "S03-C1", "text": "騙徒可能取得網路上的短音訊，再利用仿聲程式冒充親友遇急難需要金錢。", "location": "正文：short audio clip／voice-cloning program", "sources": ["S03"], "locator": "正文：short audio clip／voice-cloning program"}, {"id": "S03-C2", "text": "不能只信聲音；應用自己已知屬於本人的電話查證，聯絡不到時向其他親友確認。", "location": "正文：Don’t trust the voice", "sources": ["S03"], "locator": "正文：Don’t trust the voice"}, {"id": "S03-C3", "text": "對方要求電匯、加密貨幣或禮物卡卡號與PIN等難追回的付款方式，可能是警訊。", "location": "正文：payment methods", "sources": ["S03"], "locator": "正文：payment methods"}], "updated": "2026-11-15", "html": "\u003ch1>S03 Scammers use AI to enhance their family emergency schemes\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>原文：\u003ca href=\"https://consumer.ftc.gov/consumer-alerts/2023/03/scammers-use-ai-enhance-their-family-emergency-schemes\">Federal Trade Commission（美國聯邦貿易委員會），作者Alvaro Puig\u003c/a>\u003c/p>\u003cp>原文日期：2023-03-20；查閱：2026-11-15\u003c/p>\u003cp>封存節錄：\u003ca href=\"raw/S03.md\">raw/S03.md\u003c/a>\u003c/p>\u003ch2>LLM 整理的可支持主張\u003c/h2>\u003ch3>S03-C1\u003c/h3>\u003cp>騙徒可能取得網路上的短音訊，再利用仿聲程式冒充親友遇急難需要金錢。\u003c/p>\u003cp>依據位置：正文：short audio clip／voice-cloning program。\u003c/p>\u003ch3>S03-C2\u003c/h3>\u003cp>不能只信聲音；應用自己已知屬於本人的電話查證，聯絡不到時向其他親友確認。\u003c/p>\u003cp>依據位置：正文：Don’t trust the voice。\u003c/p>\u003ch3>S03-C3\u003c/h3>\u003cp>對方要求電匯、加密貨幣或禮物卡卡號與PIN等難追回的付款方式，可能是警訊。\u003c/p>\u003cp>依據位置：正文：payment methods。\u003c/p>\u003ch2>範圍與不能推論的內容\u003c/h2>\u003cul>\u003cli>開場祖孫急難情境是解說範例，不是附鑑識與當事人的具名個案。\u003c/li>\u003cli>未訂出通用的三秒音訊門檻、成功率或任何聲音都可完美複製的保證。\u003c/li>\u003cli>頁面讀者留言不是FTC查證的案例證據，尤其不能把留言中的秒數當官方結論。\u003c/li>\u003cli>美國通報入口不替代臺灣165與警方報案。\u003c/li>\u003c/ul>\u003ch2>知識連結\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "S04", "path": "sources/S04.md", "title": "Criminals Use Generative Artificial Intelligence to Facilitate Financial Fraud", "kind": "source", "sources": ["S04"], "summary": "用於概念分類、AI與社會工程關係、偽造性影像風險及查證步驟。", "claims": [{"id": "S04-C1", "text": "生成式AI可協助騙徒大量製作較可信的訊息、假社群人物與圖片；文字更流暢不代表內容可信。", "location": "AI-Generated Text與Images", "sources": ["S04"], "locator": "AI-Generated Text與Images"}, {"id": "S04-C2", "text": "仿聲能被用來冒充親友急需資金；假視訊可被用來冒充主管或證明網友是所謂真人。", "location": "AI-Generated Audio與Videos", "sources": ["S04"], "locator": "AI-Generated Audio與Videos"}, {"id": "S04-C3", "text": "騙徒也可偽造受害者色情圖片要求付款，形成性影像勒索。", "location": "AI-Generated Images：sextortion", "sources": ["S04"], "locator": "AI-Generated Images：sextortion"}, {"id": "S04-C4", "text": "防範包括親友暗語、限制公開影像聲音與帳號追蹤者，掛斷後另找官方或已知電話查證，不向僅網路認識的人提供敏感資料或付款。", "location": "Tips to protect yourself", "sources": ["S04"], "locator": "Tips to protect yourself"}], "updated": "2026-11-15", "html": "\u003ch1>S04 Criminals Use Generative Artificial Intelligence to Facilitate Financial Fraud\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>原文：\u003ca href=\"https://www.ic3.gov/PSA/2024/PSA241203\">Federal Bureau of Investigation／Internet Crime Complaint Center（FBI IC3）\u003c/a>\u003c/p>\u003cp>原文日期：2024-12-03；查閱：2026-11-15\u003c/p>\u003cp>封存節錄：\u003ca href=\"raw/S04.md\">raw/S04.md\u003c/a>\u003c/p>\u003ch2>LLM 整理的可支持主張\u003c/h2>\u003ch3>S04-C1\u003c/h3>\u003cp>生成式AI可協助騙徒大量製作較可信的訊息、假社群人物與圖片；文字更流暢不代表內容可信。\u003c/p>\u003cp>依據位置：AI-Generated Text與Images。\u003c/p>\u003ch3>S04-C2\u003c/h3>\u003cp>仿聲能被用來冒充親友急需資金；假視訊可被用來冒充主管或證明網友是所謂真人。\u003c/p>\u003cp>依據位置：AI-Generated Audio與Videos。\u003c/p>\u003ch3>S04-C3\u003c/h3>\u003cp>騙徒也可偽造受害者色情圖片要求付款，形成性影像勒索。\u003c/p>\u003cp>依據位置：AI-Generated Images：sextortion。\u003c/p>\u003ch3>S04-C4\u003c/h3>\u003cp>防範包括親友暗語、限制公開影像聲音與帳號追蹤者，掛斷後另找官方或已知電話查證，不向僅網路認識的人提供敏感資料或付款。\u003c/p>\u003cp>依據位置：Tips to protect yourself。\u003c/p>\u003ch2>範圍與不能推論的內容\u003c/h2>\u003cul>\u003cli>這是手法警示，未提供臺灣Gen Z各類詐騙發生率或受害統計。\u003c/li>\u003cli>沒有證明每個假帳號、釣魚訊息或社群詐騙都使用深偽。\u003c/li>\u003cli>雖列視聽瑕疵供留意，未提供保證辨識方法；看不出瑕疵不能證明真人。\u003c/li>\u003cli>本頁未提供專門處理性影像勒索的完整臺灣求助流程或支付後結果統計。\u003c/li>\u003c/ul>\u003ch2>知識連結\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "S05", "path": "sources/S05.md", "title": "【謠言澄清】AI換臉性行為恐嚇信件入侵 中市警局：假訊息依法究辦", "kind": "source", "sources": ["S05"], "summary": "證明臺灣有官方確認的合成性影像恐嚇案；教材不展示或散播原影像。", "claims": [{"id": "S05-C1", "text": "臺中警方說明，當時已有八個機關收到附換臉不雅影像的恐嚇信，要求付款。", "location": "背景", "sources": ["S05"], "locator": "背景"}, {"id": "S05-C2", "text": "警方指出照片背景與位置相同、男性頭像不同，並稱相片鑑識已確認為深偽合成。", "location": "查核2、3", "sources": ["S05"], "locator": "查核2、3"}, {"id": "S05-C3", "text": "這類信件被判為廣發式恐嚇取財；官方提醒保留相關證據向警方報案，不轉傳散播內容，可撥110或165。", "location": "查核4、結論", "sources": ["S05"], "locator": "查核4、結論"}], "updated": "2026-11-15", "html": "\u003ch1>S05 【謠言澄清】AI換臉性行為恐嚇信件入侵 中市警局：假訊息依法究辦\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>原文：\u003ca href=\"https://www.taichung.gov.tw/8868/8872/1269419/2931416\">臺中市政府／臺中市政府警察局\u003c/a>\u003c/p>\u003cp>原文日期：2025-03-15；查閱：2026-11-15\u003c/p>\u003cp>封存節錄：\u003ca href=\"raw/S05.md\">raw/S05.md\u003c/a>\u003c/p>\u003ch2>LLM 整理的可支持主張\u003c/h2>\u003ch3>S05-C1\u003c/h3>\u003cp>臺中警方說明，當時已有八個機關收到附換臉不雅影像的恐嚇信，要求付款。\u003c/p>\u003cp>依據位置：背景。\u003c/p>\u003ch3>S05-C2\u003c/h3>\u003cp>警方指出照片背景與位置相同、男性頭像不同，並稱相片鑑識已確認為深偽合成。\u003c/p>\u003cp>依據位置：查核2、3。\u003c/p>\u003ch3>S05-C3\u003c/h3>\u003cp>這類信件被判為廣發式恐嚇取財；官方提醒保留相關證據向警方報案，不轉傳散播內容，可撥110或165。\u003c/p>\u003cp>依據位置：查核4、結論。\u003c/p>\u003ch2>範圍與不能推論的內容\u003c/h2>\u003cul>\u003cli>是機關收到的紙本恐嚇信，不能改成Instagram私訊、LINE視訊或Gen Z學生個案。\u003c/li>\u003cli>沒有給出受害者已付款金額，不能寫成警方證實多少損失。\u003c/li>\u003cli>不能推論收信者曾拍攝真實性影像；本頁正是澄清合成內容。\u003c/li>\u003cli>發布時調查狀態不等於2026年已破案或定罪。\u003c/li>\u003c/ul>\u003ch2>知識連結\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "S06", "path": "sources/S06.md", "title": "Partnering with our industry to advance AI transparency and literacy", "kind": "source", "sources": ["S06"], "summary": "讓學生學會閱讀AI標示並理解『無標示』仍需查證；不把標籤當身分證。", "claims": [{"id": "S06-C1", "text": "TikTok在2024年5月宣布開始對來自部分其他平台的AI內容自動加標，使用C2PA Content Credentials資訊。", "location": "開頭與Partnering with our industry to label AIGC", "sources": ["S06"], "locator": "開頭與Partnering with our industry to label AIGC"}, {"id": "S06-C2", "text": "該公告說，平台已有TikTok AI特效標示，且要求創作者標示逼真的AI生成內容。", "location": "Investing in transparency as AI evolves", "sources": ["S06"], "locator": "Investing in transparency as AI evolves"}, {"id": "S06-C3", "text": "自動辨認受限於內容是否帶有相應中繼資料，官方預期標示增加會是漸進的。", "location": "Driving industry adoption", "sources": ["S06"], "locator": "Driving industry adoption"}], "updated": "2026-11-15", "html": "\u003ch1>S06 Partnering with our industry to advance AI transparency and literacy\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>原文：\u003ca href=\"https://newsroom.tiktok.com/partnering-with-our-industry-to-advance-ai-transparency-and-literacy?lang=en\">TikTok Newsroom\u003c/a>\u003c/p>\u003cp>原文日期：2024-05-09；查閱：2026-11-15\u003c/p>\u003cp>封存節錄：\u003ca href=\"raw/S06.md\">raw/S06.md\u003c/a>\u003c/p>\u003ch2>LLM 整理的可支持主張\u003c/h2>\u003ch3>S06-C1\u003c/h3>\u003cp>TikTok在2024年5月宣布開始對來自部分其他平台的AI內容自動加標，使用C2PA Content Credentials資訊。\u003c/p>\u003cp>依據位置：開頭與Partnering with our industry to label AIGC。\u003c/p>\u003ch3>S06-C2\u003c/h3>\u003cp>該公告說，平台已有TikTok AI特效標示，且要求創作者標示逼真的AI生成內容。\u003c/p>\u003cp>依據位置：Investing in transparency as AI evolves。\u003c/p>\u003ch3>S06-C3\u003c/h3>\u003cp>自動辨認受限於內容是否帶有相應中繼資料，官方預期標示增加會是漸進的。\u003c/p>\u003cp>依據位置：Driving industry adoption。\u003c/p>\u003ch2>範圍與不能推論的內容\u003c/h2>\u003cul>\u003cli>沒有AI標籤不等於真人或未經合成；來源明示中繼資料限制。\u003c/li>\u003cli>有AI標籤只交代製作背景，不足證明其中商品、投資或身分敘述為真。\u003c/li>\u003cli>這是2024年的功能公告，不保證2026年所有地區、版本或所有上傳內容的標示覆蓋。\u003c/li>\u003cli>不是TikTok深偽詐騙發生率、通報成功率或介面逐步操作指南。\u003c/li>\u003c/ul>\u003ch2>知識連結\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "S07", "path": "sources/S07.md", "title": "Designing Account Security Across Our Apps", "kind": "source", "sources": ["S07"], "summary": "學生遇帳號存取問題先從官方入口開始，避免相信陌生私訊自稱能付費代救帳號。", "claims": [{"id": "S07-C1", "text": "Meta公告以instagram.com/hacked作為回報、處理Instagram帳號存取問題的官方入口。", "location": "Instagram Account Access Support", "sources": ["S07"], "locator": "Instagram Account Access Support"}, {"id": "S07-C2", "text": "保持帳號綁定的電子郵件與電話安全、有效，與取得復原支援有關。", "location": "Taking a Closer Look at Contact Points", "sources": ["S07"], "locator": "Taking a Closer Look at Contact Points"}, {"id": "S07-C3", "text": "帳號復原會涉及多種信號與驗證挑戰，支援系統也可能被惡意人士濫用。", "location": "Applying Adversarial Design to Account Security", "sources": ["S07"], "locator": "Applying Adversarial Design to Account Security"}], "updated": "2026-11-15", "html": "\u003ch1>S07 Designing Account Security Across Our Apps\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>原文：\u003ca href=\"https://about.fb.com/news/2022/12/designing-account-security-across-our-apps/\">Meta Newsroom；作者Nathaniel Gleicher、Jimena Almendares\u003c/a>\u003c/p>\u003cp>原文日期：2022-12-15；查閱：2026-11-15\u003c/p>\u003cp>封存節錄：\u003ca href=\"raw/S07.md\">raw/S07.md\u003c/a>\u003c/p>\u003ch2>LLM 整理的可支持主張\u003c/h2>\u003ch3>S07-C1\u003c/h3>\u003cp>Meta公告以instagram.com/hacked作為回報、處理Instagram帳號存取問題的官方入口。\u003c/p>\u003cp>依據位置：Instagram Account Access Support。\u003c/p>\u003ch3>S07-C2\u003c/h3>\u003cp>保持帳號綁定的電子郵件與電話安全、有效，與取得復原支援有關。\u003c/p>\u003cp>依據位置：Taking a Closer Look at Contact Points。\u003c/p>\u003ch3>S07-C3\u003c/h3>\u003cp>帳號復原會涉及多種信號與驗證挑戰，支援系統也可能被惡意人士濫用。\u003c/p>\u003cp>依據位置：Applying Adversarial Design to Account Security。\u003c/p>\u003ch2>範圍與不能推論的內容\u003c/h2>\u003cul>\u003cli>是2022年公告；未實際登入、測試或證實2026年每個帳號能看到相同復原步驟。\u003c/li>\u003cli>不保證帳號可取回，也不提供復原完成時限。\u003c/li>\u003cli>公告的驗證徽章說明不等於任何私訊、投資邀請或匯款要求都可信。\u003c/li>\u003cli>帳號盜用與復原不是深偽技術的存在證據。\u003c/li>\u003c/ul>\u003ch2>知識連結\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "S08", "path": "sources/S08.md", "title": "注意！「幫忙投票」是盜帳號陷阱，8月帳號被盜通報數增加97%", "kind": "source", "sources": ["S08"], "summary": "臺灣熟悉情境的對照：朋友頭像與既有聊天室仍可能來自被盜帳號，需另外驗身分。", "claims": [{"id": "S08-C1", "text": "LINE說明常見手法包括已被盜的親友帳號傳投票邀請，誘點連結或騙取認證碼，再盜用帳號。", "location": "開頭常見手法", "sources": ["S08"], "locator": "開頭常見手法"}, {"id": "S08-C2", "text": "官方建議先停下、不急點連結，另用通話或見面確認親友；不把LINE認證碼交給別人或填入不明網頁。", "location": "停、查、碼不給；認證碼就是帳號鑰匙", "sources": ["S08"], "locator": "停、查、碼不給；認證碼就是帳號鑰匙"}, {"id": "S08-C3", "text": "若帳號遭盜用，官方提醒不要直接刪除App；尚可登入時嘗試再次登入並改密碼，無法登入時用免登入客服表單求助。", "location": "三項安全設定第3項", "sources": ["S08"], "locator": "三項安全設定第3項"}, {"id": "S08-C4", "text": "綁定Apple或Google帳號、開啟偵測可疑網站，是該公告列出的防護選項。", "location": "三項安全設定第1、2項", "sources": ["S08"], "locator": "三項安全設定第1、2項"}], "updated": "2026-11-15", "html": "\u003ch1>S08 注意！「幫忙投票」是盜帳號陷阱，8月帳號被盜通報數增加97%\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>原文：\u003ca href=\"https://www.linecorp.com/tw/pr/news/2026/0909/\">LINE台灣／LINE Plus Corporation官方新聞室\u003c/a>\u003c/p>\u003cp>原文日期：2026-09-09；查閱：2026-11-15\u003c/p>\u003cp>封存節錄：\u003ca href=\"raw/S08.md\">raw/S08.md\u003c/a>\u003c/p>\u003ch2>LLM 整理的可支持主張\u003c/h2>\u003ch3>S08-C1\u003c/h3>\u003cp>LINE說明常見手法包括已被盜的親友帳號傳投票邀請，誘點連結或騙取認證碼，再盜用帳號。\u003c/p>\u003cp>依據位置：開頭常見手法。\u003c/p>\u003ch3>S08-C2\u003c/h3>\u003cp>官方建議先停下、不急點連結，另用通話或見面確認親友；不把LINE認證碼交給別人或填入不明網頁。\u003c/p>\u003cp>依據位置：停、查、碼不給；認證碼就是帳號鑰匙。\u003c/p>\u003ch3>S08-C3\u003c/h3>\u003cp>若帳號遭盜用，官方提醒不要直接刪除App；尚可登入時嘗試再次登入並改密碼，無法登入時用免登入客服表單求助。\u003c/p>\u003cp>依據位置：三項安全設定第3項。\u003c/p>\u003ch3>S08-C4\u003c/h3>\u003cp>綁定Apple或Google帳號、開啟偵測可疑網站，是該公告列出的防護選項。\u003c/p>\u003cp>依據位置：三項安全設定第1、2項。\u003c/p>\u003ch2>範圍與不能推論的內容\u003c/h2>\u003cul>\u003cli>標題97%是LINE內部2026年8月相較7月的帳號被盜客服通報件數變化；不是臺灣全部帳號、Gen Z或深偽案件成長率。教材可省略這個數字。\u003c/li>\u003cli>這則說明是釣魚與帳號盜用，不代表使用AI換臉或仿聲。\u003c/li>\u003cli>綁定或客服不保證復原成功，功能選項可能因版本而不同。\u003c/li>\u003cli>未提供所有其他社群平台相同操作或跨平台共用驗證碼規則。\u003c/li>\u003c/ul>\u003ch2>知識連結\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "W01", "path": "concepts/basics.md", "title": "深偽與社群詐騙的基本概念", "summary": "分清合成媒體、冒名與釣魚；逼真不等於可信。", "sources": ["S01", "S04"], "claim_ids": ["S01-C1", "S04-C1", "S04-C2", "S04-C3"], "related": ["concepts/trust.md", "concepts/verification.md"], "sections": [{"title": "深偽改變的是媒體", "text": "本課用『深偽』指以 AI 合成或操控人物影像、影片或聲音，造成身分或事件的錯誤印象。可見形式包括換臉、仿聲與假視訊。這是依官方列出的媒體手法整理的入門定義。", "claims": ["S01-C1", "S04-C2"]}, {"title": "詐騙利用的是信任", "text": "AI 也會生成更流暢的文字、假頭像與假人物。一般釣魚或帳號盜用未必使用深偽；不能把全部社群詐騙都叫 deepfake。合成媒體本身也不等於犯罪，需看是否被用來欺騙、勒索或傷害。", "claims": ["S04-C1", "S04-C3"]}], "kind": "concept", "claims": [{"id": "S01-C1", "text": "警方宣導指出，換臉與仿聲可被用來冒充親友。", "location": "正文：AI變臉／AI變聲假親友", "sources": ["S01"], "locator": "正文：AI變臉／AI變聲假親友"}, {"id": "S04-C1", "text": "生成式AI可協助騙徒大量製作較可信的訊息、假社群人物與圖片；文字更流暢不代表內容可信。", "location": "AI-Generated Text與Images", "sources": ["S04"], "locator": "AI-Generated Text與Images"}, {"id": "S04-C2", "text": "仿聲能被用來冒充親友急需資金；假視訊可被用來冒充主管或證明網友是所謂真人。", "location": "AI-Generated Audio與Videos", "sources": ["S04"], "locator": "AI-Generated Audio與Videos"}, {"id": "S04-C3", "text": "騙徒也可偽造受害者色情圖片要求付款，形成性影像勒索。", "location": "AI-Generated Images：sextortion", "sources": ["S04"], "locator": "AI-Generated Images：sextortion"}], "updated": "2026-11-15", "html": "\u003ch1>W01 深偽與社群詐騙的基本概念\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>分清合成媒體、冒名與釣魚；逼真不等於可信。\u003c/p>\u003ch2>跨來源知識\u003c/h2>\u003ch3>深偽改變的是媒體\u003c/h3>\u003cp>本課用『深偽』指以 AI 合成或操控人物影像、影片或聲音，造成身分或事件的錯誤印象。可見形式包括換臉、仿聲與假視訊。這是依官方列出的媒體手法整理的入門定義。\u003c/p>\u003cp>依據：S01-C1、S04-C2。\u003c/p>\u003ch3>詐騙利用的是信任\u003c/h3>\u003cp>AI 也會生成更流暢的文字、假頭像與假人物。一般釣魚或帳號盜用未必使用深偽；不能把全部社群詐騙都叫 deepfake。合成媒體本身也不等於犯罪，需看是否被用來欺騙、勒索或傷害。\u003c/p>\u003cp>依據：S04-C1、S04-C3。\u003c/p>\u003ch2>原始來源\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS01.md\">S01\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS04.md\">S04\u003c/a>\u003c/li>\u003c/ul>\u003ch2>相關知識\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=concepts%2Ftrust.md\">concepts/trust.md\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=concepts%2Fverification.md\">concepts/verification.md\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "W02", "path": "concepts/trust.md", "title": "熟悉聲音與急迫要求的信任陷阱", "summary": "辨識催促、保密與付款要求，改用已知管道驗身分。", "sources": ["S02", "S03", "S04", "S08"], "claim_ids": ["S02-C1", "S02-C3", "S03-C1", "S03-C2", "S03-C3", "S04-C2", "S04-C4", "S08-C1", "S08-C2"], "related": ["concepts/basics.md", "concepts/verification.md"], "sections": [{"title": "聲音不是付款授權", "text": "FTC 示警，騙徒可能用公開短音訊仿聲，假冒親友急需金錢。收到請求先停止付款，用原本就知道的電話回撥；聯絡不到時再找其他親友。不要把對方新提供的電話當獨立查證。", "claims": ["S03-C1", "S03-C2", "S03-C3", "S04-C4"]}, {"title": "不同平台會承載不同環節", "text": "香港個案是電郵邀請、預錄視訊建立權威、再以即時訊息下匯款指示；LINE 另示警被盜親友帳號傳投票邀請。兩者不是同一案件，也不表示所有跨平台聊天都使用 AI。教材以『身分線索 → 信任 → 行動要求』整理共同風險。", "claims": ["S02-C1", "S02-C3", "S08-C1", "S08-C2"]}], "kind": "concept", "claims": [{"id": "S02-C1", "text": "警方於2024年1月底接獲一宗案件：騙徒冒充英國總部財務總監，先用釣魚電郵邀請員工參與所謂機密交易的視訊會議。", "location": "答覆(1)：end-January 2024", "sources": ["S02"], "locator": "答覆(1)：end-January 2024"}, {"id": "S02-C3", "text": "警方當時相信會議是由公開影片與聲音製作的預錄內容，報案者與騙徒實際沒有互動，後續匯款指示透過即時通訊傳送。", "location": "答覆(1)：pre-recorded；no interaction", "sources": ["S02"], "locator": "答覆(1)：pre-recorded；no interaction"}, {"id": "S03-C1", "text": "騙徒可能取得網路上的短音訊，再利用仿聲程式冒充親友遇急難需要金錢。", "location": "正文：short audio clip／voice-cloning program", "sources": ["S03"], "locator": "正文：short audio clip／voice-cloning program"}, {"id": "S03-C2", "text": "不能只信聲音；應用自己已知屬於本人的電話查證，聯絡不到時向其他親友確認。", "location": "正文：Don’t trust the voice", "sources": ["S03"], "locator": "正文：Don’t trust the voice"}, {"id": "S03-C3", "text": "對方要求電匯、加密貨幣或禮物卡卡號與PIN等難追回的付款方式，可能是警訊。", "location": "正文：payment methods", "sources": ["S03"], "locator": "正文：payment methods"}, {"id": "S04-C2", "text": "仿聲能被用來冒充親友急需資金；假視訊可被用來冒充主管或證明網友是所謂真人。", "location": "AI-Generated Audio與Videos", "sources": ["S04"], "locator": "AI-Generated Audio與Videos"}, {"id": "S04-C4", "text": "防範包括親友暗語、限制公開影像聲音與帳號追蹤者，掛斷後另找官方或已知電話查證，不向僅網路認識的人提供敏感資料或付款。", "location": "Tips to protect yourself", "sources": ["S04"], "locator": "Tips to protect yourself"}, {"id": "S08-C1", "text": "LINE說明常見手法包括已被盜的親友帳號傳投票邀請，誘點連結或騙取認證碼，再盜用帳號。", "location": "開頭常見手法", "sources": ["S08"], "locator": "開頭常見手法"}, {"id": "S08-C2", "text": "官方建議先停下、不急點連結，另用通話或見面確認親友；不把LINE認證碼交給別人或填入不明網頁。", "location": "停、查、碼不給；認證碼就是帳號鑰匙", "sources": ["S08"], "locator": "停、查、碼不給；認證碼就是帳號鑰匙"}], "updated": "2026-11-15", "html": "\u003ch1>W02 熟悉聲音與急迫要求的信任陷阱\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>辨識催促、保密與付款要求，改用已知管道驗身分。\u003c/p>\u003ch2>跨來源知識\u003c/h2>\u003ch3>聲音不是付款授權\u003c/h3>\u003cp>FTC 示警，騙徒可能用公開短音訊仿聲，假冒親友急需金錢。收到請求先停止付款，用原本就知道的電話回撥；聯絡不到時再找其他親友。不要把對方新提供的電話當獨立查證。\u003c/p>\u003cp>依據：S03-C1、S03-C2、S03-C3、S04-C4。\u003c/p>\u003ch3>不同平台會承載不同環節\u003c/h3>\u003cp>香港個案是電郵邀請、預錄視訊建立權威、再以即時訊息下匯款指示；LINE 另示警被盜親友帳號傳投票邀請。兩者不是同一案件，也不表示所有跨平台聊天都使用 AI。教材以『身分線索 → 信任 → 行動要求』整理共同風險。\u003c/p>\u003cp>依據：S02-C1、S02-C3、S08-C1、S08-C2。\u003c/p>\u003ch2>原始來源\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS02.md\">S02\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS03.md\">S03\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS04.md\">S04\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS08.md\">S08\u003c/a>\u003c/li>\u003c/ul>\u003ch2>相關知識\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=concepts%2Fbasics.md\">concepts/basics.md\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=concepts%2Fverification.md\">concepts/verification.md\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "W03", "path": "concepts/cases.md", "title": "香港與臺中兩個官方查核案例", "summary": "保留案發時間、地區、媒介與調查限制，不改寫成學生社群個案。", "sources": ["S02", "S05"], "claim_ids": ["S02-C1", "S02-C2", "S02-C3", "S05-C1", "S05-C2", "S05-C3"], "related": ["concepts/trust.md", "concepts/response.md"], "sections": [{"title": "香港預錄視訊案", "text": "香港政府 2024-06-26 答覆說，警方於 2024 年 1 月底接獲案件。騙徒假冒英國總部財務總監，經釣魚電郵邀請員工加入會議。報案者授權轉款往五個香港銀行帳戶，損失約港幣兩億元。警方當時相信影片由公開影音製作，屬預錄且沒有互動，後續指令經即時通訊傳送。不能稱即時自由對話，也不推斷之後的調查結論。", "claims": ["S02-C1", "S02-C2", "S02-C3"]}, {"title": "臺中合成影像恐嚇信", "text": "臺中市政府 2025-03-15 公布：當時八個機關收到附不雅合成影像的恐嚇信，警方稱鑑識已確認深偽。這是紙本信件，不是 Instagram 私訊或臺灣學生案件；來源沒有給出已支付損失。官方建議保留證據報案、不轉傳內容。", "claims": ["S05-C1", "S05-C2", "S05-C3"]}], "kind": "concept", "claims": [{"id": "S02-C1", "text": "警方於2024年1月底接獲一宗案件：騙徒冒充英國總部財務總監，先用釣魚電郵邀請員工參與所謂機密交易的視訊會議。", "location": "答覆(1)：end-January 2024", "sources": ["S02"], "locator": "答覆(1)：end-January 2024"}, {"id": "S02-C2", "text": "報案者依指示授權款項轉往五個香港銀行帳戶，損失約港幣兩億元。", "location": "答覆(1)：HK$200 million", "sources": ["S02"], "locator": "答覆(1)：HK$200 million"}, {"id": "S02-C3", "text": "警方當時相信會議是由公開影片與聲音製作的預錄內容，報案者與騙徒實際沒有互動，後續匯款指示透過即時通訊傳送。", "location": "答覆(1)：pre-recorded；no interaction", "sources": ["S02"], "locator": "答覆(1)：pre-recorded；no interaction"}, {"id": "S05-C1", "text": "臺中警方說明，當時已有八個機關收到附換臉不雅影像的恐嚇信，要求付款。", "location": "背景", "sources": ["S05"], "locator": "背景"}, {"id": "S05-C2", "text": "警方指出照片背景與位置相同、男性頭像不同，並稱相片鑑識已確認為深偽合成。", "location": "查核2、3", "sources": ["S05"], "locator": "查核2、3"}, {"id": "S05-C3", "text": "這類信件被判為廣發式恐嚇取財；官方提醒保留相關證據向警方報案，不轉傳散播內容，可撥110或165。", "location": "查核4、結論", "sources": ["S05"], "locator": "查核4、結論"}], "updated": "2026-11-15", "html": "\u003ch1>W03 香港與臺中兩個官方查核案例\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>保留案發時間、地區、媒介與調查限制，不改寫成學生社群個案。\u003c/p>\u003ch2>跨來源知識\u003c/h2>\u003ch3>香港預錄視訊案\u003c/h3>\u003cp>香港政府 2024-06-26 答覆說，警方於 2024 年 1 月底接獲案件。騙徒假冒英國總部財務總監，經釣魚電郵邀請員工加入會議。報案者授權轉款往五個香港銀行帳戶，損失約港幣兩億元。警方當時相信影片由公開影音製作，屬預錄且沒有互動，後續指令經即時通訊傳送。不能稱即時自由對話，也不推斷之後的調查結論。\u003c/p>\u003cp>依據：S02-C1、S02-C2、S02-C3。\u003c/p>\u003ch3>臺中合成影像恐嚇信\u003c/h3>\u003cp>臺中市政府 2025-03-15 公布：當時八個機關收到附不雅合成影像的恐嚇信，警方稱鑑識已確認深偽。這是紙本信件，不是 Instagram 私訊或臺灣學生案件；來源沒有給出已支付損失。官方建議保留證據報案、不轉傳內容。\u003c/p>\u003cp>依據：S05-C1、S05-C2、S05-C3。\u003c/p>\u003ch2>原始來源\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS02.md\">S02\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS05.md\">S05\u003c/a>\u003c/li>\u003c/ul>\u003ch2>相關知識\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=concepts%2Ftrust.md\">concepts/trust.md\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=concepts%2Fresponse.md\">concepts/response.md\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "W04", "path": "concepts/platforms.md", "title": "TikTok 標籤與 Instagram LINE 帳號風險", "summary": "平台標示、帳號安全與深偽是三個不同問題。", "sources": ["S06", "S07", "S08"], "claim_ids": ["S06-C1", "S06-C2", "S06-C3", "S07-C1", "S07-C2", "S07-C3", "S08-C1", "S08-C2", "S08-C3", "S08-C4"], "related": ["concepts/basics.md", "concepts/response.md"], "sections": [{"title": "TikTok 的 AI 標示", "text": "2024-05-09 公告說 TikTok 開始讀取部分外來內容的 C2PA Content Credentials 自動標示 AI 內容。標示受中繼資料與逐步導入限制；沒有標示不能證明真人。有標示只交代製作背景，也不能保證其中的身分或投資說法。這不是 2026 年全覆蓋功能測試。", "claims": ["S06-C1", "S06-C2", "S06-C3"]}, {"title": "熟悉聊天室仍可能被冒用", "text": "LINE 2026-09-09 警告，被盜親友帳號會發投票訊息、騙取認證碼。應另外通話或見面核實，不把認證碼交給他人。這是帳號盜用/釣魚範例，未證明用到深偽。Meta 2022 年公告的 instagram.com/hacked 是帳號存取問題官方入口，不代表任何帳號都能立即復原。", "claims": ["S08-C1", "S08-C2", "S07-C1", "S07-C2", "S07-C3"]}], "kind": "concept", "claims": [{"id": "S06-C1", "text": "TikTok在2024年5月宣布開始對來自部分其他平台的AI內容自動加標，使用C2PA Content Credentials資訊。", "location": "開頭與Partnering with our industry to label AIGC", "sources": ["S06"], "locator": "開頭與Partnering with our industry to label AIGC"}, {"id": "S06-C2", "text": "該公告說，平台已有TikTok AI特效標示，且要求創作者標示逼真的AI生成內容。", "location": "Investing in transparency as AI evolves", "sources": ["S06"], "locator": "Investing in transparency as AI evolves"}, {"id": "S06-C3", "text": "自動辨認受限於內容是否帶有相應中繼資料，官方預期標示增加會是漸進的。", "location": "Driving industry adoption", "sources": ["S06"], "locator": "Driving industry adoption"}, {"id": "S07-C1", "text": "Meta公告以instagram.com/hacked作為回報、處理Instagram帳號存取問題的官方入口。", "location": "Instagram Account Access Support", "sources": ["S07"], "locator": "Instagram Account Access Support"}, {"id": "S07-C2", "text": "保持帳號綁定的電子郵件與電話安全、有效，與取得復原支援有關。", "location": "Taking a Closer Look at Contact Points", "sources": ["S07"], "locator": "Taking a Closer Look at Contact Points"}, {"id": "S07-C3", "text": "帳號復原會涉及多種信號與驗證挑戰，支援系統也可能被惡意人士濫用。", "location": "Applying Adversarial Design to Account Security", "sources": ["S07"], "locator": "Applying Adversarial Design to Account Security"}, {"id": "S08-C1", "text": "LINE說明常見手法包括已被盜的親友帳號傳投票邀請，誘點連結或騙取認證碼，再盜用帳號。", "location": "開頭常見手法", "sources": ["S08"], "locator": "開頭常見手法"}, {"id": "S08-C2", "text": "官方建議先停下、不急點連結，另用通話或見面確認親友；不把LINE認證碼交給別人或填入不明網頁。", "location": "停、查、碼不給；認證碼就是帳號鑰匙", "sources": ["S08"], "locator": "停、查、碼不給；認證碼就是帳號鑰匙"}, {"id": "S08-C3", "text": "若帳號遭盜用，官方提醒不要直接刪除App；尚可登入時嘗試再次登入並改密碼，無法登入時用免登入客服表單求助。", "location": "三項安全設定第3項", "sources": ["S08"], "locator": "三項安全設定第3項"}, {"id": "S08-C4", "text": "綁定Apple或Google帳號、開啟偵測可疑網站，是該公告列出的防護選項。", "location": "三項安全設定第1、2項", "sources": ["S08"], "locator": "三項安全設定第1、2項"}], "updated": "2026-11-15", "html": "\u003ch1>W04 TikTok 標籤與 Instagram LINE 帳號風險\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>平台標示、帳號安全與深偽是三個不同問題。\u003c/p>\u003ch2>跨來源知識\u003c/h2>\u003ch3>TikTok 的 AI 標示\u003c/h3>\u003cp>2024-05-09 公告說 TikTok 開始讀取部分外來內容的 C2PA Content Credentials 自動標示 AI 內容。標示受中繼資料與逐步導入限制；沒有標示不能證明真人。有標示只交代製作背景，也不能保證其中的身分或投資說法。這不是 2026 年全覆蓋功能測試。\u003c/p>\u003cp>依據：S06-C1、S06-C2、S06-C3。\u003c/p>\u003ch3>熟悉聊天室仍可能被冒用\u003c/h3>\u003cp>LINE 2026-09-09 警告，被盜親友帳號會發投票訊息、騙取認證碼。應另外通話或見面核實，不把認證碼交給他人。這是帳號盜用/釣魚範例，未證明用到深偽。Meta 2022 年公告的 instagram.com/hacked 是帳號存取問題官方入口，不代表任何帳號都能立即復原。\u003c/p>\u003cp>依據：S08-C1、S08-C2、S07-C1、S07-C2、S07-C3。\u003c/p>\u003ch2>原始來源\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS06.md\">S06\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS07.md\">S07\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS08.md\">S08\u003c/a>\u003c/li>\u003c/ul>\u003ch2>相關知識\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=concepts%2Fbasics.md\">concepts/basics.md\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=concepts%2Fresponse.md\">concepts/response.md\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "W05", "path": "concepts/verification.md", "title": "可操作的獨立查證流程", "summary": "先停止不可逆行動，再離開原對話用已知管道核對，留存證據。", "sources": ["S01", "S03", "S04", "S05", "S08"], "claim_ids": ["S01-C2", "S01-C3", "S03-C2", "S04-C4", "S05-C3", "S08-C2"], "related": ["concepts/trust.md", "concepts/response.md"], "sections": [{"title": "停 離 查 留", "text": "本課將官方建議整理為自訂教學口訣：停＝先不匯款、不交個資與認證碼；離＝離開對方提供的查證路徑；查＝自行撥已知電話或開官方 App/網站，必要時向其他親友確認；留＝保留相關帳號、時間、對話與交易證據，私下提供官方。此口訣是課程整理，不冒稱官方既有品牌。", "claims": ["S01-C3", "S03-C2", "S04-C4", "S05-C3", "S08-C2"]}, {"title": "線索不能變成保證", "text": "部分官方宣導提出觀察視聽異常、要求特定動作或家庭密語。這些只增加線索，來源沒有準確率或通用保證；最重要仍是另用已知聯絡方式核實。不能看不出破綻就匯款，也不把單一偵測器結果當身分授權。", "claims": ["S01-C2", "S03-C2", "S04-C4"]}], "kind": "concept", "claims": [{"id": "S01-C2", "text": "可事先與親友約定通關密語，遇到疑似假親友時查核身分。", "location": "正文：通關密語", "sources": ["S01"], "locator": "正文：通關密語"}, {"id": "S01-C3", "text": "遇可疑要求先不匯款、不提供個資，有疑慮可撥165反詐騙專線。", "location": "正文：2不3要", "sources": ["S01"], "locator": "正文：2不3要"}, {"id": "S03-C2", "text": "不能只信聲音；應用自己已知屬於本人的電話查證，聯絡不到時向其他親友確認。", "location": "正文：Don’t trust the voice", "sources": ["S03"], "locator": "正文：Don’t trust the voice"}, {"id": "S04-C4", "text": "防範包括親友暗語、限制公開影像聲音與帳號追蹤者，掛斷後另找官方或已知電話查證，不向僅網路認識的人提供敏感資料或付款。", "location": "Tips to protect yourself", "sources": ["S04"], "locator": "Tips to protect yourself"}, {"id": "S05-C3", "text": "這類信件被判為廣發式恐嚇取財；官方提醒保留相關證據向警方報案，不轉傳散播內容，可撥110或165。", "location": "查核4、結論", "sources": ["S05"], "locator": "查核4、結論"}, {"id": "S08-C2", "text": "官方建議先停下、不急點連結，另用通話或見面確認親友；不把LINE認證碼交給別人或填入不明網頁。", "location": "停、查、碼不給；認證碼就是帳號鑰匙", "sources": ["S08"], "locator": "停、查、碼不給；認證碼就是帳號鑰匙"}], "updated": "2026-11-15", "html": "\u003ch1>W05 可操作的獨立查證流程\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>先停止不可逆行動，再離開原對話用已知管道核對，留存證據。\u003c/p>\u003ch2>跨來源知識\u003c/h2>\u003ch3>停 離 查 留\u003c/h3>\u003cp>本課將官方建議整理為自訂教學口訣：停＝先不匯款、不交個資與認證碼；離＝離開對方提供的查證路徑；查＝自行撥已知電話或開官方 App/網站，必要時向其他親友確認；留＝保留相關帳號、時間、對話與交易證據，私下提供官方。此口訣是課程整理，不冒稱官方既有品牌。\u003c/p>\u003cp>依據：S01-C3、S03-C2、S04-C4、S05-C3、S08-C2。\u003c/p>\u003ch3>線索不能變成保證\u003c/h3>\u003cp>部分官方宣導提出觀察視聽異常、要求特定動作或家庭密語。這些只增加線索，來源沒有準確率或通用保證；最重要仍是另用已知聯絡方式核實。不能看不出破綻就匯款，也不把單一偵測器結果當身分授權。\u003c/p>\u003cp>依據：S01-C2、S03-C2、S04-C4。\u003c/p>\u003ch2>原始來源\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS01.md\">S01\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS03.md\">S03\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS04.md\">S04\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS05.md\">S05\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS08.md\">S08\u003c/a>\u003c/li>\u003c/ul>\u003ch2>相關知識\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=concepts%2Ftrust.md\">concepts/trust.md\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=concepts%2Fresponse.md\">concepts/response.md\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}, {"id": "W06", "path": "concepts/response.md", "title": "遇到冒用或勒索時的求助與復原", "summary": "不責備受害者；保留證據，使用臺灣警察與平台正式管道。", "sources": ["S01", "S04", "S05", "S07", "S08"], "claim_ids": ["S01-C3", "S04-C3", "S04-C4", "S05-C3", "S07-C1", "S08-C3"], "related": ["concepts/verification.md", "concepts/cases.md"], "sections": [{"title": "在臺灣找誰協助", "text": "可疑詐騙先停止付款與個資交付，保留證據，撥 165 反詐騙專線諮詢；需要報案可撥 110 或向警察機關報案。收到合成性影像威脅不表示曾拍攝該影像，不轉傳散播。不要把付款寫成能保證刪除或止損，也不承諾一定追回款項。", "claims": ["S01-C3", "S05-C3", "S04-C3"]}, {"title": "使用官方帳號支援", "text": "Instagram 帳號存取問題可自行開官方 instagram.com/hacked。LINE 公告提醒帳號遭盜時不要直接刪除 App；無法登入時用官方免登入客服表單。這裡只提供官方入口與原文日期，沒有登入、提交個資或測試復原成功；介面可能依版本不同。", "claims": ["S07-C1", "S08-C3"]}], "kind": "concept", "claims": [{"id": "S01-C3", "text": "遇可疑要求先不匯款、不提供個資，有疑慮可撥165反詐騙專線。", "location": "正文：2不3要", "sources": ["S01"], "locator": "正文：2不3要"}, {"id": "S04-C3", "text": "騙徒也可偽造受害者色情圖片要求付款，形成性影像勒索。", "location": "AI-Generated Images：sextortion", "sources": ["S04"], "locator": "AI-Generated Images：sextortion"}, {"id": "S04-C4", "text": "防範包括親友暗語、限制公開影像聲音與帳號追蹤者，掛斷後另找官方或已知電話查證，不向僅網路認識的人提供敏感資料或付款。", "location": "Tips to protect yourself", "sources": ["S04"], "locator": "Tips to protect yourself"}, {"id": "S05-C3", "text": "這類信件被判為廣發式恐嚇取財；官方提醒保留相關證據向警方報案，不轉傳散播內容，可撥110或165。", "location": "查核4、結論", "sources": ["S05"], "locator": "查核4、結論"}, {"id": "S07-C1", "text": "Meta公告以instagram.com/hacked作為回報、處理Instagram帳號存取問題的官方入口。", "location": "Instagram Account Access Support", "sources": ["S07"], "locator": "Instagram Account Access Support"}, {"id": "S08-C3", "text": "若帳號遭盜用，官方提醒不要直接刪除App；尚可登入時嘗試再次登入並改密碼，無法登入時用免登入客服表單求助。", "location": "三項安全設定第3項", "sources": ["S08"], "locator": "三項安全設定第3項"}], "updated": "2026-11-15", "html": "\u003ch1>W06 遇到冒用或勒索時的求助與復原\u003c/h1>\u003cp>Wiki更新日期：2026-11-15\u003c/p>\u003cp>不責備受害者；保留證據，使用臺灣警察與平台正式管道。\u003c/p>\u003ch2>跨來源知識\u003c/h2>\u003ch3>在臺灣找誰協助\u003c/h3>\u003cp>可疑詐騙先停止付款與個資交付，保留證據，撥 165 反詐騙專線諮詢；需要報案可撥 110 或向警察機關報案。收到合成性影像威脅不表示曾拍攝該影像，不轉傳散播。不要把付款寫成能保證刪除或止損，也不承諾一定追回款項。\u003c/p>\u003cp>依據：S01-C3、S05-C3、S04-C3。\u003c/p>\u003ch3>使用官方帳號支援\u003c/h3>\u003cp>Instagram 帳號存取問題可自行開官方 instagram.com/hacked。LINE 公告提醒帳號遭盜時不要直接刪除 App；無法登入時用官方免登入客服表單。這裡只提供官方入口與原文日期，沒有登入、提交個資或測試復原成功；介面可能依版本不同。\u003c/p>\u003cp>依據：S07-C1、S08-C3。\u003c/p>\u003ch2>原始來源\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS01.md\">S01\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS04.md\">S04\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS05.md\">S05\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS07.md\">S07\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=sources%2FS08.md\">S08\u003c/a>\u003c/li>\u003c/ul>\u003ch2>相關知識\u003c/h2>\u003cul>\u003cli>\u003ca href=\"wiki.html#page=concepts%2Fverification.md\">concepts/verification.md\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=concepts%2Fcases.md\">concepts/cases.md\u003c/a>\u003c/li>\u003cli>\u003ca href=\"wiki.html#page=index.md\">回知識索引\u003c/a>\u003c/li>\u003c/ul>"}]</script><script>(()=>{const pages=JSON.parse(document.getElementById('wiki-data').textContent);const list=document.getElementById('wiki-list'),article=document.getElementById('wiki-article'),search=document.getElementById('wiki-search');function nav(){list.replaceChildren();let n=0;for(const p of pages){if(!(p.title+' '+p.summary+' '+p.sources.join(' ')).toLowerCase().includes(search.value.toLowerCase()))continue;const a=document.createElement('a');a.textContent=p.id+' '+p.title;a.href='#page='+encodeURIComponent(p.path);list.appendChild(a);n++}if(!n)list.textContent='沒有符合的頁面，請改用較短關鍵字。'}function show(){const key=new URLSearchParams(location.hash.slice(1)).get('page');const p=pages.find(p=>p.path===key)||pages.find(p=>p.kind==='concept');article.innerHTML=p.html;document.title=p.title+'｜LLM Wiki'}search.addEventListener('input',nav);window.addEventListener('hashchange',show);nav();show()})();</script></body></html>
